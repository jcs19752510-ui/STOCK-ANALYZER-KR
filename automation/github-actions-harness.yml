# 실제로 동작하는 예시 워크플로. `automation/run-harness-agent.sh`를 그대로 호출한다.
# 브랜치 전략(feature/**, develop, main, release)은 예시이니 프로젝트에 맞게 바꿀 것.
#
# 필수 secret: ANTHROPIC_API_KEY (claude CLI 인증용 — 조직/버전에 따라 다른 인증 방식일 수 있으니
# 실제 CI에 붙이기 전에 `claude -p "hi"` 가 그 러너 환경에서 정말 동작하는지 먼저 확인할 것)

name: harness-pipeline

on:
  push:
    branches: ["feature/**"]
  pull_request:
    branches: ["develop", "main"]
  release:
    types: [created]

env:
  ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}

jobs:
  unit-and-integration:
    if: github.ref_type != 'tag'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: claude CLI 설치 확인
        run: |
          command -v claude || npm install -g @anthropic-ai/claude-code
          claude --version
      - name: "6단계 - 단위테스트 (미테스트 unit 전체 처리)"
        run: |
          chmod +x automation/run-harness-agent.sh
          ./automation/run-harness-agent.sh 06-unit-tester \
            "docs/harness/units/ 를 스캔해서 unit-<n>-note.md는 있는데 unit-<n>-test.md가 없거나 FAIL인 단위를 전부 처리하라."
      - name: "7단계 - 업무단위 통합테스트 (PR에서만)"
        if: github.event_name == 'pull_request'
        run: |
          ./automation/run-harness-agent.sh 07-integration-tester \
            "이번 PR이 속한 업무 단위(feature)의 모든 06 결과가 PASS인지 확인하고 통합테스트를 수행하라."

  full-system-and-security:
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop'
    needs: [unit-and-integration]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: npm install -g @anthropic-ai/claude-code
      - name: "8단계 - 전체 풀테스트 (+ UAT 섹션)"
        run: |
          chmod +x automation/run-harness-agent.sh
          ./automation/run-harness-agent.sh 08-full-system-tester ""
      - name: "9단계 - 보안검증"
        run: ./automation/run-harness-agent.sh 09-security-auditor ""

  deploy-test:
    needs: [full-system-and-security]
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: npm install -g @anthropic-ai/claude-code
      - name: "10단계 - 배포테스트 (스테이징)"
        run: |
          chmod +x automation/run-harness-agent.sh
          ./automation/run-harness-agent.sh 10-deploy-tester ""

  documentation-handoff:
    needs: [deploy-test]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: npm install -g @anthropic-ai/claude-code
      - name: "11단계 - 운영 Runbook/사용자·관리자 매뉴얼/API 문서"
        run: |
          chmod +x automation/run-harness-agent.sh
          ./automation/run-harness-agent.sh 11-documentation-writer ""

  deploy:
    needs: [documentation-handoff]
    runs-on: ubuntu-latest
    # 핵심: 이 environment에 GitHub 저장소 Settings > Environments 에서
    # "Required reviewers"를 반드시 등록해야 한다. 그래야 사람이 승인 버튼을 누르기 전까지
    # 아래 step이 실행되지 않는다 (규칙 E — 파일만으로는 이 보호가 걸리지 않는다).
    environment:
      name: production-deploy-approval
    steps:
      - uses: actions/checkout@v4
      - run: npm install -g @anthropic-ai/claude-code
      - name: "12단계 - 실제 배포 (승인된 경우에만 이 줄에 도달)"
        run: |
          chmod +x automation/run-harness-agent.sh
          ./automation/run-harness-agent.sh 12-deployer \
            "이 CI 실행이 여기까지 온 것 자체가 environment 승인 게이트를 통과했다는 뜻이다. 승인 사실을 배포 로그에 기록하라."

  post-deploy-verify:
    needs: [deploy]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: npm install -g @anthropic-ai/claude-code
      - name: "13단계 - 배포후 검증"
        run: |
          chmod +x automation/run-harness-agent.sh
          ./automation/run-harness-agent.sh 13-post-deploy-verifier ""

# 참고: run-harness-agent.sh는 사람의 판단이 필요한 상황(규칙 A)을 만나면 exit code 75로 끝난다.
# GitHub Actions는 네이티브 "neutral" 상태가 없으므로 이 예시는 75도 job 실패로 처리한다
# (안전한 기본값 — 배포/병합을 막는 쪽으로 fail-safe). 로그의 "HARNESS_BLOCKED:" 뒤 질문을 확인하고
# 응답을 반영한 뒤 재실행(re-run job)하면 된다. 알림을 더 적극적으로 받고 싶다면 이 job들에
# `slack-notify` 같은 액션을 실패 시(`if: failure()`) 추가로 붙이는 것을 권장한다.
