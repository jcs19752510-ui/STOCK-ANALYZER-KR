# Render Blueprint — 통합 서비스(웹+API 1개, DEC-078). 설명서: docs/ops/unified-service-guide.md
# * 2026-10-06 전환. 이전 2개 서비스 구성은 deploy/render/render.two-services.yaml (롤백용).
# * 서비스 이름을 기존 웹과 같게 유지 → 주소(stock-analyzer-web-q7cx.onrender.com)가 그대로다.
# * 컨테이너 1개 안에서 API(내부 127.0.0.1:8000)와 웹(공개 PORT)이 함께 돈다. 외부에는 웹 포트만 열린다.
# * 비밀값은 sync:false (Render 화면에서 입력). 기존 값이 이미 있는 키는 그대로 유지된다.
# * 2026-10-06(DEC-081): 코드 푸시 자동 배포 켬(autoDeployTrigger: commit). DB 구조(마이그레이션)는 자동 적용되지 않는다 → docs/ops/unified-service-guide.md §5
services:
  - type: web
    name: stock-analyzer-web
    runtime: docker
    plan: starter                      # 유료(2026-10-06 전환). 대시보드에서만 바꾸면 동기화 때 되돌아갈 수 있어 여기도 맞춘다
    region: singapore
    branch: PROD_SCH
    dockerfilePath: ./deploy/unified.Dockerfile
    dockerContext: .
    autoDeployTrigger: "commit"        # PROD_SCH에 푸시하면 Render가 자동으로 새로 빌드·배포한다(DEC-081). 새 버전이 /healthz를 통과하지 못하면 기존 버전이 유지된다
    healthCheckPath: /healthz
    envVars:
      # ---- 웹(기존 값 그대로)
      - key: AUTH_REQUIRED
        sync: false
      - key: SESSION_SECRET
        sync: false
      - key: NEXT_PUBLIC_AUTH_ENABLED
        sync: false
      - key: NEXT_PUBLIC_BROWSER_API_BASE_URL
        sync: false
      - key: PUBLIC_API_INTERNAL_TOKEN          # 웹→API 내부 토큰(같은 컨테이너라 한 값만 있으면 된다)
        sync: false
      - key: NEXT_PUBLIC_API_BASE_URL           # 통합 후: 같은 컨테이너 내부 주소(빌드 때 코드에 들어간다)
        value: http://127.0.0.1:8000
      - key: NEXT_PUBLIC_PRICE_EXPOSURE_ENABLED
        value: "true"
      - key: NEXT_PUBLIC_PATTERN_SCREEN_ENABLED
        value: "true"
      - key: PORT
        value: "3000"
      - key: FRONTEND_TRUSTED_PROXY_HOPS
        value: "0"
      # ---- API(기존 API 서비스에서 옮겨 올 값 2개: 비밀)
      - key: PUBLIC_API_DATABASE_URL
        sync: false
      - key: PUBLIC_API_AUTH_DATABASE_URL
        sync: false
      # ---- API(고정값)
      - key: PUBLIC_API_REQUIRE_INTERNAL_TOKEN  # 내부 토큰 없는 호출 거부(웹 서버만 API를 부를 수 있다)
        value: "true"
      - key: PUBLIC_API_REQUIRE_TRUSTED_PROXY   # API는 컨테이너 안에서만 열리므로 프록시 대역 설정이 필요 없다
        value: "false"
      - key: PUBLIC_API_DB_CONNECT_TIMEOUT_SECONDS
        value: "10"
      - key: PUBLIC_API_DB_STATEMENT_TIMEOUT_MS
        value: "8000"
      - key: PUBLIC_API_REQUEST_TIMEOUT_SECONDS
        value: "15"
      - key: PUBLIC_API_PRICE_EXPOSURE_ENABLED
        value: "true"
      - key: PATTERN_SCREEN_ENABLED
        value: "true"
