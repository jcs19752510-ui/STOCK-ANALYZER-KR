# 2027년 KRX 휴장일 캘린더 (REQ-012) — **추정 초안(공식 확정 아님)**.
#
# 작성 근거: 한국거래소의 2027년 휴장일 공고는 아직 나오지 않아(통상 전년도 말 공고) 원문을 대조하지 못했다.
# 그래서 공휴일 규정(설날·추석 연휴, 어린이날·삼일절·광복절·개천절·한글날·부처님오신날·성탄절의 대체공휴일 적용,
# 현충일은 대체공휴일 없음)과 음력 날짜(설날 2027-02-06, 부처님오신날 2027-05-13, 추석 2027-09-15)로 계산한 평일 휴장일이다.
# KRX는 법정 공휴일 외에 근로자의 날(5/1)·연말휴장(12/31)에도 쉰다(2026년 파일과 같은 관행).
# 토·일요일은 파일에 적지 않아도 자동으로 비거래일이다(평일만 적는다).
#
# 반드시 할 일: ① 임시공휴일 지정·선거일 등은 발표되는 대로 이 파일에 추가한다 ② 한국거래소 공식 공고(krx.co.kr)가 나오면
# 원문과 대조해 이 주석의 "추정 초안"을 "공식 확인"으로 바꾼다 ③ 고친 뒤 `py -3.12 scripts\load_calendar.py data\calendar\2027.yaml`
# (fix_local_data.ps1이 data\calendar\ 의 모든 파일을 자동으로 적재한다).
# NXT(대체거래소)는 KRX와 같은 휴장일을 따른다고 가정한다(2026년 파일과 같은 가정, 실사용 전 재확인 필요).

