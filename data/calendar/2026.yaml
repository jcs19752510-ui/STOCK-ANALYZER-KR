# 2026년 KRX 휴장일 캘린더 (REQ-012).
#
# 출처: 한국거래소 공식 공고 원문을 직접 인용하지 못했고(웹 검색 도구로는
# krx.co.kr의 원문 공고 페이지에 접근하지 못함), 서로 독립적인 2개의 2차
# 출처(jangjeon.kr, glasswallet.com)가 완전히 일치하는 17일 목록을 교차
# 검증해 작성했다(2026-09-21 조사). 영문 범용 캘린더 사이트(calendarlabs.com)는
# 지방선거일(6/3)·제헌절(7/17)·연말휴장(12/31) 3건이 누락되어 있어 신뢰도가
# 낮다고 판단해 채택하지 않았다.
#
# 주의: 이 파일은 "공식 확정" 데이터가 아니라 "신뢰할 만한 2차 출처 교차검증"
# 수준이다. 실사용(실제 배포/실거래일 판단) 전 반드시 한국거래소 공식 공고
# (krx.co.kr) 원문으로 최종 재확인이 필요하다.
#
# NXT(대체거래소)는 별도 휴장일 공고를 찾지 못해, 관행상 KRX와 동일한 휴장일을
# 따른다고 가정했다(마감 시각만 다름). 이 가정도 실사용 전 재확인 필요.

